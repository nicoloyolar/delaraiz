name: delaraiz
description: "Plataforma de gestión cultural de la Corporación de La Raíz (Concepción, Chile) — postulación de bandas para La Grúa del Rock y panel administrativo."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Firebase ---
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.2

  # --- State management ---
  flutter_riverpod: ^2.5.1

  # --- Navegación (soporta rutas nombradas en Web con deep-linking) ---
  go_router: ^14.2.7

  # --- Formulario público: selección de archivos y apertura de enlaces externos ---
  file_picker: ^8.1.2
  url_launcher: ^6.3.0

  # --- Utilidades ---
  intl: ^0.19.0
  uuid: ^4.5.1

  # --- Tipografía ---
  google_fonts: ^6.2.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
